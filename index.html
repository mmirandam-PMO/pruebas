<html lang="es">
<head>

  <style>
    :root {
      --navy: #1B355D;
      --bg-main: #F7F8FA;
      --white: #ffffff;
      --border: #E1E4E8;
      --text-dark: #24292F;
      --text-muted: #6B7280;
      --shadow: 0 4px 16px rgba(27, 42, 74, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-dark); min-height: 100vh; }
    .wrap { max-width: 1440px; margin: 0 auto; padding: 0 34px; }

    header.masthead {
      background: linear-gradient(90deg, var(--navy) 0%, #1B4E5A 100%);
      color: var(--white);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 14px rgba(27,42,74,.28);
      margin-bottom: 28px;
    }
    .header-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; }
    
    /* CABECERA CORREGIDA: TEXTO BLANCO GRANDE Y SUBTÍTULO ACTUALIZADO */
    .brand-top { font-size: 11px; text-transform: uppercase; font-weight: 700; color: #7DACE2; letter-spacing: .5px; }
    .brand h1 { font-family: 'Merriweather', serif; font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 16px; }

    .search-area input { 
      background: rgba(255,255,255,0.15); color: var(--white); border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px; padding: 8px 16px; width: 280px; font-size: 13px; outline: none; 
    }
    .search-area input:focus { background: var(--white); color: var(--text-dark); }

    .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .column { display: flex; flex-direction: column; gap: 24px; }
    
    .card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; position: relative; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; z-index: 10; }
    
    .header-minorista::before { background: linear-gradient(90deg, #4A90E2 0%, #2980B9 100%); }
    .header-regulatorios::before { background: linear-gradient(90deg, #923D1F 0%, #D35400 100%); }
    .header-habilitadores::before { background: linear-gradient(90deg, #1F3A60 0%, #34495E 100%); }

    .card-head { padding: 18px 20px 14px; background: #FAFBFC; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .card-head h2 { font-family: 'Merriweather', serif; font-size: 20px; font-weight: 800; color: var(--navy); }
    .badge { background: rgba(27,42,74,0.08); color: var(--navy); padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 700; }
    
    .subsection-header { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; padding: 10px 18px 4px; letter-spacing: 0.5px; }
    .section-area { padding: 4px 18px 14px; }
    .proj-list { display: flex; flex-direction: column; gap: 6px; }
    
    .proj-row { background: #F5F7FA; padding: 10px 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .proj-name { font-weight: 500; color: var(--text-dark); }
    .proj-owner { font-size: 11px; font-weight: 700; background: #E2E8F0; color: #4A5568; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
