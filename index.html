<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio de Proyectos 2027 · PMO</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado Principal -->
  <header class="masthead">
    <div class="wrap header-inner">
      <div class="brand">
        <h1>Portafolio de Proyectos 2027</h1>
	<p class="brand-top">3 Programas &nbsp;•&nbsp; 41 Proyectos</p>
              </div>
      <div class="search-area">
        <input type="text" id="search-input" placeholder="🔍 Buscar...">
      </div>
    </div>
  </header>

  <!-- Tablero Operativo en 3 Columnas Fijas para evitar desfases -->
  <main class="wrap">
    <div class="dashboard-grid" id="dashboard">
      <div class="column" id="col-1"></div>
      <div class="column" id="col-2"></div>
      <div class="column" id="col-3"></div>
    </div>
  </main>

  <!-- Insumo de datos y motor dinámico -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
