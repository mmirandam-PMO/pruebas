<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Proyecto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Panel de Administración</h1>
        <nav>
            <!-- El botón de Roadmap ha sido eliminado de esta sección -->
            <a href="#dashboard" class="nav-link active">Dashboard</a>
            <a href="#config" class="nav-link">Configuración</a>
        </nav>
    </header>

    <main>
        <section id="status-container">
            <h2>Datos del Sistema</h2>
            <div class="card-grid">
                <!-- Los siguientes valores fueron actualizados (antes en rojo) -->
                <div class="card">
                    <h3>Versión Actual</h3>
                    <p class="data-value">v2.4.1</p>
                </div>
                <div class="card">
                    <h3>Última Actualización</h3>
                    <p class="data-value">16/10/2026</p>
                </div>
                <div class="card">
                    <h3>Estado del Servidor</h3>
                    <p class="data-value status-online">Operativo</p>
                </div>
                <div class="card">
                    <h3>Usuarios Activos</h3>
                    <p class="data-value">1,245</p>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
