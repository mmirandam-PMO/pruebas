<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadmap 2027 · PMO</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1B355D;
      --bg-main: #F7F8FA;
      --white: #ffffff;
      --border: #E1E4E8;
      --text-dark: #24292F;
      --text-muted: #6B7280;
      --shadow: 0 4px 16px rgba(27, 42, 74, 0.08);
      --radius: 14px;
      
      /* Colores Solicitados */
      --timeline-bar: #B1CDEE;
      --timeline-bg: #F6F7F9;
      --tag-bg: #EFF4FA;
      --tag-text: #2B6CB0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-dark); min-height: 100vh; padding-bottom: 40px; }
    .wrap { max-width: 1440px; margin: 0 auto; padding: 0 34px; }

    header.masthead {
      background: linear-gradient(90deg, var(--navy) 0%, #1B4E5A 100%);
      color: var(--white);
      padding: 16px 0;
      box-shadow: 0 2px 14px rgba(27,42,74,.28);
      margin-bottom: 28px;
    }
    .header-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; }
    .brand-top { font-size: 11px; text-transform: uppercase; font-weight: 700; color: #7DACE2; letter-spacing: .5px; margin-bottom: 4px; }
    .brand h1 { font-family: 'Merriweather', serif; font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 16px; }
    
    /* BOTÓN ESTILO OVALADO BLANCO (Alineado a la izquierda del título según captura) */
    .btn-back {
      background: var(--white);
      color: var(--navy);
      text-decoration: none;
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: background 0.2s, transform 0.1s;
      font-family: 'Inter', sans-serif;
    }
    .btn-back:hover { 
      background: #F1F5F9;
      transform: translateY(-1px);
    }

    .search-area input { 
      background: rgba(255,255,255,0.15); 
      color: var(--white); 
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px; 
      padding: 8px 16px; 
      width: 320px; 
      font-size: 13px; 
      outline: none; 
    }
    .search-area input::placeholder { color: rgba(255,255,255,0.6); }
    .search-area input:focus { background: var(--white); color: var(--text-dark); }

    /* ENCABEZADO FIJO DE COLUMNAS (STICKY) */
    .roadmap-header-row {
      position: sticky;
      top: 0;
      z-index: 90;
      display: grid;
      grid-template-columns: 180px 1fr 180px 400px;
      gap: 16px;
      padding: 14px 24px;
      font-size: 13px;
      font-weight: 700;
      color: var(--white);
      background-color: var(--navy);
      border-radius: 14px;
      align-items: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .timeline-quarters { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; }
    .roadmap-container { display: flex; flex-direction: column; gap: 8px; }

    /* TARJETA BLANCA MENOS ANCHA (Más delgada verticalmente / Menos Padding) */
    .roadmap-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 180px 1fr 180px 400px;
      gap: 16px;
      padding: 10px 24px; /* Ajustado de 16px a 10px para reducir el grosor blanco arriba/abajo */
      align-items: center;
      transition: transform 0.15s, background 0.15s;
      border: 1px solid transparent;
    }
    .roadmap-card:hover {
      transform: translateX(3px);
      background: #FAFBFC;
      border-color: var(--border);
    }

    .col-classification { 
      font-size: 12px; 
      font-weight: 600; 
      padding: 4px 12px; 
      border-radius: 6px; 
      display: inline-block; 
      width: fit-content;
      background-color: var(--tag-bg);
      color: var(--tag-text);
      white-space: nowrap;
    }

    .col-project { font-size: 13.5px; font-weight: 600; color: var(--navy); line-height: 1.4; }
    .col-responsible { font-size: 12.5px; font-weight: 500; color: #4A5568; }
    .col-responsible.tbd { color: #E85301; font-weight: 600; }

    /* CONTENEDOR TIMELINE AJUSTADO AL NUEVO ANCHO DE TARJETA */
    .col-timeline {
      background: var(--timeline-bg);
      height: 38px; /* Ajustado de 44px a 38px para acoplarse proporcionalmente al diseño más delgado */
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 0 16px;
    }

    .timeline-grid-lines {
      position: absolute;
      top: 0; left: 16px; right: 16px; bottom: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      pointer-events: none;
    }
    .timeline-grid-line { border-right: 1px dashed rgba(0, 0, 0, 0.04); }
    .timeline-grid-line:last-child { border-right: none; }

    .timeline-bar-wrapper { position: relative; width: 100%; height: 14px; }

    /* BARRA DE PROGRESO DE PROYECTO REDONDEADA */
    .timeline-bar {
      position: absolute;
      height: 14px;
      background: var(--timeline-bar);
      border-radius: 20px;
      transition: all 0.3s ease;
    }

    @media (max-width: 1200px) {
      .roadmap-header-row, .roadmap-card { grid-template-columns: 150px 1fr 140px 320px; }
    }
    @media (max-width: 768px) {
      .roadmap-header-row { display: none; }
      .roadmap-card { grid-template-columns: 1fr; gap: 10px; padding: 16px; }
      .col-timeline { margin-top: 4px; }
    }
  </style>
</head>
